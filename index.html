<!DOCTYPE html>
<html lang="id">
<head>

    <title>tokoh barokah jaya</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff3e0;
            text-align: center;
            margin: 0;
        }

        header {
            background-color: #ff5722;
            color: white;
            padding: 20px;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 30px;
        }

        .card {
            background: white;
            width: 250px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
        }

        .card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 8px;
        }

        .pesan {
            display: inline-block;
            background-color: #25d366;
            color: white;
            padding: 10px 20px;
            margin-top: 10px;
            text-decoration: none;
            border-radius: 5px;
        }

        .pesan:hover {
            background-color: #128c7e;
        }
    </style>
</head>

<body>

    <header>
